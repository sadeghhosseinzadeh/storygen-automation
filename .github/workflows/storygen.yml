name: Story Generation

on:
  repository_dispatch:   # triggered by your VPS bot
  workflow_dispatch:     # optional manual trigger

jobs:
  save-order:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Save order payload
        run: |
          mkdir -p orders
          echo '${{ toJson(github.event.client_payload) }}' > orders/order_${{ github.event.client_payload.order_id }}.json

      - name: Save photo files list
        run: |
          echo '${{ toJson(github.event.client_payload.photo_files) }}' > orders/photos_${{ github.event.client_payload.order_id }}.txt

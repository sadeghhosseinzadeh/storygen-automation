name: Story Generation

on:
  workflow_dispatch:   # allows manual trigger
  push:
    branches:
      - main           # runs when you push to main
  repository_dispatch: # allows external API trigger (from your bot)

jobs:
  build-story:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save order payload
        run: |
          mkdir -p orders/${{ github.event.client_payload.order_id }}
          echo '${{ toJson(github.event.client_payload) }}' \
            > orders/${{ github.event.client_payload.order_id }}/metadata.json

      # Instead of running a missing script, just save info
      - name: Save photo list
        run: |
          echo '${{ toJson(github.event.client_payload.photo_files) }}' \
            > orders/${{ github.event.client_payload.order_id }}/photos.txt

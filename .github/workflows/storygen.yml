name: Story Generation

on:
  repository_dispatch:
    types: [storygen]   # must match event_type from VPS
  workflow_dispatch:     # optional manual trigger

jobs:
  build-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug payload
        run: echo '${{ toJson(github.event.client_payload) }}'

      - name: Save order payload
        run: |
          mkdir -p orders/${{ github.event.client_payload.order_id }}
          echo '${{ toJson(github.event.client_payload) }}' \
            > orders/${{ github.event.client_payload.order_id }}/metadata.json

      - name: Save photo list
        run: |
          echo '${{ toJson(github.event.client_payload.photo_files) }}' \
            > orders/${{ github.event.client_payload.order_id }}/photos.txt

name: Story Generator

permissions:
  contents: write
  actions: write
  packages: write

on:
  release:
    types: [published]

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      # 0. Fix slow Ubuntu mirror
      - name: Switch to fast Ubuntu mirror
        run: |
          sudo find /etc/apt -type f -name "*.list" -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
          sudo find /etc/apt -type f -name "*.sources" -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
          sudo apt-get -o Acquire::Retries=0 update

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Download release assets directly
      - name: Download release assets
        run: |
          mkdir -p assets
          echo '${{ toJson(github.event.release.assets) }}' | jq -r '.[] | .browser_download_url' | while read url; do
            echo "Downloading $url..."
            curl -sSL "$url" -o "assets/$(basename "$url")"
          done

          echo "Downloaded assets:"
          ls -la assets

          if [ ! -f "assets/order.json" ]; then
            echo "❌ order.json is missing!"
            exit 1
          fi

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 4. Cache pip packages for standard dependencies (excludes storygen)
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 5. Cache u2net model (rembg)
      - name: Cache u2net model
        uses: actions/cache@v3
        with:
          path: ~/.u2net
          key: u2net-model

      # 6. Install system dependencies for Cairo and Arabic/Persian RTL fonts
      - name: Install system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=0 update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev \
            libraqm-dev libraqm0 libfribidi-dev libharfbuzz-dev \
            fonts-farsiweb fonts-dejavu-core

      # 7. Install dependencies (Always forces the latest storygen build)
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install arabic-reshaper python-bidi
          pip install --no-cache-dir --upgrade --force-reinstall git+https://github.com/sadeghhosseinzadeh/storygen.git@main
          pip install -r requirements.txt

      # 8. Run story generator
      - name: Generate story
        run: |
          python story_engine/generate_story.py \
            --assets_dir assets \
            --output_dir output

      # 9. Upload story assets back to release (uploads story.png, story.jpg, story.json)
      - name: Upload story to release
        run: |
          python story_engine/upload_to_release.py \
            --upload_url "${{ github.event.release.upload_url }}" \
            --story_dir output \
            --token "${{ secrets.GITHUB_TOKEN }}"

name: Generate Story

permissions:
  contents: write
  actions: write
  packages: write
  
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets (correct release ID)
        run: |
          gh release download ${{ github.event.release.id }} \
            --repo ${{ github.repository }} \
            --dir assets

      - name: Install Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip

      - name: Install dependencies
        run: |
          pip install pillow requests

      - name: Run story generator
        run: |
          python3 story_engine/generate_story.py assets/order.json assets/photo_1.png

      - name: Upload story assets
        run: |
          gh release upload ${{ github.event.release.id }} \
            story.json story.png \
            --repo ${{ github.repository }} \
            --clobber
